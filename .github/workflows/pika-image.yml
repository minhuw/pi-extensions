name: pika image

# Builds the pika server image natively for amd64 and arm64, smoke-tests each, and publishes one multi-arch image to
# ghcr.io/<owner>/pika: `edge` and `sha-<commit>` from master, `<x.y.z>`, `<x.y>`, and `latest` from `pika-v<x.y.z>`
# tags. Pull requests build and smoke-test without publishing.

on:
  pull_request:
    paths:
      - services/pika/**
      - "!services/pika/**/*.md"
      - "!services/pika/deploy/**"
      - .github/workflows/pika-image.yml
  push:
    branches:
      - master
    tags:
      - pika-v*
    paths:
      - services/pika/**
      - "!services/pika/**/*.md"
      - "!services/pika/deploy/**"
      - .github/workflows/pika-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pika-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DESCRIPTION: Self-hosted store and Notion-style viewer for pi coding-agent trajectories

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pika" >> "$GITHUB_ENV"
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/pika-v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' services/pika/Cargo.toml | head -1)
          if [[ "${GITHUB_REF_NAME#pika-v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match services/pika/Cargo.toml version $version"
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=pika
            org.opencontainers.image.description=${{ env.DESCRIPTION }}

      - uses: docker/setup-buildx-action@v4

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: services/pika
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: pika:smoke
          load: true
          cache-from: type=gha,scope=pika-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=pika-${{ env.PLATFORM_PAIR }}

      - name: Smoke test
        run: |
          password="smoke-$(openssl rand -hex 12)"
          docker run -d --name pika-root -p 127.0.0.1:7171:7171 -e PIKA_PASSWORD="$password" pika:smoke
          # A base path without slashes exercises the HEALTHCHECK's normalization.
          docker run -d --name pika-path -e PIKA_BASE_PATH=pika -e PIKA_AUTH=none pika:smoke
          cleanup() {
            local status=$?
            if [[ $status -ne 0 ]]; then docker logs pika-root; docker logs pika-path; docker logs pika-open 2>/dev/null || true; fi
            docker rm -f pika-root pika-path pika-open >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Without a password or PIKA_AUTH the server refuses to start.
          status=0
          output=$(timeout 60 docker run --rm --name pika-open pika:smoke 2>&1) || status=$?
          echo "$output"
          if [[ $status -ne 2 ]] || ! grep -q '^pika: no password configured' <<<"$output"; then
            echo "::error::a container without a password exited with status $status instead of refusing to start with status 2"
            exit 1
          fi

          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:7171/api/health >/dev/null 2>&1 && break; sleep 1; done
          health=$(curl -fsS http://127.0.0.1:7171/api/health)
          echo "$health"
          if ! jq -e '.features | index("relay")' <<<"$health" >/dev/null; then
            echo "::error::the health answer's features do not list relay"
            exit 1
          fi
          page=$(curl -fsS http://127.0.0.1:7171/)
          grep -q '<meta name="pika-base" content="/">' <<<"$page"
          if grep -q 'does not include the web UI' <<<"$page"; then
            echo "::error::the image serves the placeholder page instead of the embedded web UI"
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:7171/api/v1/facets)
          if [[ "$code" != 401 ]]; then
            echo "::error::GET /api/v1/facets without a cookie answered $code instead of 401"
            exit 1
          fi
          token=$(docker exec pika-root pika token create smoke)
          grep -q '^pika_' <<<"$token"
          docker exec pika-root pika token list | grep -q '^smoke'
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:7171/api/relay/v1/sessions)
          if [[ "$code" != 401 ]]; then
            echo "::error::GET /api/relay/v1/sessions without a token answered $code instead of 401"
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:7171/api/relay/v1/sessions)
          if [[ "$code" != 200 ]]; then
            echo "::error::GET /api/relay/v1/sessions with a device token answered $code instead of 200"
            exit 1
          fi

          for _ in $(seq 1 45); do
            health=$(docker inspect -f '{{.State.Health.Status}}' pika-path)
            [[ "$health" == healthy ]] && break
            sleep 2
          done
          echo "pika-path health: $health"
          [[ "$health" == healthy ]]

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: services/pika
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=pika-${{ env.PLATFORM_PAIR }}

      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.push.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the multi-arch image
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pika" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=edge,branch=master
            type=sha,prefix=sha-,format=short
            type=match,pattern=pika-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=pika-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/pika-v') }}

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            "${args[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
