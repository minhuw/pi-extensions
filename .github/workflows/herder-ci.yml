name: Herder CI

on:
  pull_request:
    paths:
      - .github/workflows/herder-ci.yml
      - extensions/herder/**
      - package.json
      - package-lock.json
      - tsconfig.json
  push:
    branches:
      - master
    paths:
      - .github/workflows/herder-ci.yml
      - extensions/herder/**
      - package.json
      - package-lock.json
      - tsconfig.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herder-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify herder
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install package dependencies
        run: npm ci

      - name: Run Herder deterministic suite
        run: npm run test:herder
