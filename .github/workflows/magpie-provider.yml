name: Magpie provider CI

on:
  pull_request:
    paths:
      - .github/workflows/magpie-provider.yml
      - extensions/magpie-provider/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - vitest.config.*
  push:
    branches:
      - master
    paths:
      - .github/workflows/magpie-provider.yml
      - extensions/magpie-provider/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - vitest.config.*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magpie-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Magpie on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Test Magpie and bundled Pi loading
        run: npm run test:magpie-provider
