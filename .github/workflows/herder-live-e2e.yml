name: Herder Live E2E

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/herder-live-e2e.yml
      - extensions/herder/**
      - extensions/magpie-provider/**
      - extensions/shared/**
      - package.json
      - package-lock.json
      - tsconfig.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herder-live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    name: Pi / Poorman
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HERDER_E2E_TIMEOUT_MS: "2400000"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install search dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version

      - name: Install package dependencies
        run: npm ci

      - name: Validate Magpie credentials
        shell: bash
        env:
          MAGPIE_API_KEY: ${{ secrets.MAGPIE_API_KEY }}
          MAGPIE_BASE_URL: ${{ secrets.MAGPIE_BASE_URL }}
        run: |
          set -euo pipefail
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readConfig } from "./extensions/magpie-provider/index.ts";
          try {
            if (!process.env.MAGPIE_API_KEY?.trim() || !process.env.MAGPIE_BASE_URL?.trim()) {
              throw new Error("Missing configuration");
            }
            const { origin, apiKey } = readConfig();
            for (const suffix of ["", "/", "/v1", "/v1/"]) {
              console.log(`::add-mask::${origin}${suffix}`);
            }
            const response = await fetch(`${origin}/v1/models`, {
              headers: { Authorization: `Bearer ${apiKey}` },
              redirect: "error",
              signal: AbortSignal.timeout(30_000),
            });
            await response.body?.cancel();
            if (!response.ok) throw new Error("Unsuccessful response");
          } catch {
            console.error("Magpie preflight failed: check MAGPIE_API_KEY, MAGPIE_BASE_URL, and gateway availability. Redirects are not allowed.");
            process.exitCode = 1;
          }
          NODE

      - name: Install and configure Pi
        shell: bash
        run: |
          set -euo pipefail
          pi_bin="$GITHUB_WORKSPACE/node_modules/.bin/pi"
          "$pi_bin" install "$GITHUB_WORKSPACE" --approve
          echo "HERDER_PI_BIN=$pi_bin" >> "$GITHUB_ENV"

      - name: Run live Pi E2E
        env:
          HERDER_KEEP_E2E: "1"
          MAGPIE_API_KEY: ${{ secrets.MAGPIE_API_KEY }}
          MAGPIE_BASE_URL: ${{ secrets.MAGPIE_BASE_URL }}
        run: npm run test:e2e:herder

      - name: Prepare live E2E diagnostics
        if: always()
        env:
          MAGPIE_API_KEY: ${{ secrets.MAGPIE_API_KEY }}
          MAGPIE_BASE_URL: ${{ secrets.MAGPIE_BASE_URL }}
        run: >-
          node --experimental-strip-types extensions/herder/tests/e2e/support/collect-live-artifacts.ts
          --host pi
          --output ${{ runner.temp }}/herder-live-artifacts/pi

      - name: Upload live E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: herder-live-e2e-pi-${{ github.run_attempt }}
          path: ${{ runner.temp }}/herder-live-artifacts/pi
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
