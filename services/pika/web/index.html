<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="data:," />
		<title>pika</title>
		<script>
			// Relative asset URLs must resolve against the base path, not the current route.
			(function () {
				var meta = document.querySelector('meta[name="pika-base"]');
				var base = meta ? meta.getAttribute("content") || "/" : location.pathname.replace(/\/(s|herder|search|login)(\/.*)?$/, "");
				var el = document.createElement("base");
				el.href = ("/" + base).replace(/\/+/g, "/").replace(/\/$/, "") + "/";
				document.head.appendChild(el);
			})();
			try {
				var t = localStorage.getItem("pika-theme");
				if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
				document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./src/main.tsx"></script>
	</body>
</html>
