		<title>pika</title>
		<script>
			// Relative asset URLs must resolve against the base path, not the current route.
			(function () {
				var meta = document.querySelector('meta[name="pika-base"]');
				var base = meta ? meta.getAttribute("content") || "/" : location.pathname.replace(/\/(s|runs|herder|search|login|public|settings|devices|active)(\/.*)?$/, "");
				var el = document.createElement("base");
				el.href = ("/" + base).replace(/\/+/g, "/").replace(/\/$/, "") + "/";
				document.head.appendChild(el);
			})();
			try {
				var t = localStorage.getItem("pika-theme");
				if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
				document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./src/main.tsx"></script>
	</body>
