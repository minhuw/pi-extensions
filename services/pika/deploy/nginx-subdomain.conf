# pika at https://pika.example.com
# Server: pika serve --bind 127.0.0.1:7171   (base path /)
# Devices: "url": "https://pika.example.com"

server {
    listen 80;
    listen [::]:80;
    server_name pika.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pika.example.com;

    ssl_certificate     /etc/letsencrypt/live/pika.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pika.example.com/privkey.pem;

    # At least the server's --max-body (32 MiB by default).
    client_max_body_size 32m;
    # Device uploads are gzip batches of up to 8 MiB; allow slow links.
    client_body_timeout 120s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location / {
        # Optional: authenticate here instead of PIKA_PASSWORD (htpasswd -c /etc/nginx/pika.htpasswd me).
        # auth_basic "pika";
        # auth_basic_user_file /etc/nginx/pika.htpasswd;
        proxy_pass http://127.0.0.1:7171;
    }

    # Devices authenticate with their bearer tokens.
    location /api/ingest/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:7171;
    }
}
