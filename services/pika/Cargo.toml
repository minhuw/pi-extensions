[package]
name = "pika"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "matched-path", "original-uri", "ws"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
rpassword = "7.5.4"
rusqlite = { version = "0.41.0", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }

# Password hashing is far too slow unoptimized; tests log in many times.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
